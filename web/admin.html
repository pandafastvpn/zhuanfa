<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 转发面板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">转发面板 · 管理后台</div>
    <nav>
      <a data-page="dashboard" class="active">仪表盘</a>
      <a data-page="users">用户管理</a>
      <a data-page="groups">用户组</a>
      <a data-page="ports">端口管理</a>
      <a data-page="records">协议/端口记录</a>
      <a data-page="settings">系统设置</a>
    </nav>
    <div style="margin-top:auto">
      <button class="btn secondary" id="logoutBtn" style="width:100%">退出登录</button>
    </div>
  </aside>

  <main class="content">
    <!-- 仪表盘 -->
    <section id="page-dashboard">
      <h2 style="margin-bottom:16px">仪表盘</h2>
      <div class="stats-grid" id="dashCards"></div>
      <div class="card">
        <h3>近 7 天流量</h3>
        <div id="dashChart"></div>
      </div>
      <div class="card">
        <h3>最近连接记录</h3>
        <div class="table-wrap"><table id="dashRecent"><thead><tr>
          <th>时间</th><th>用户</th><th>端口</th><th>类型</th><th>协议</th><th>来源</th><th>动作</th><th>目标</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </section>

    <!-- 用户管理 -->
    <section id="page-users" class="hidden">
      <div class="toolbar">
        <h2 style="margin:0">用户管理</h2>
        <div class="spacer"></div>
        <button class="btn" id="addUserBtn">+ 添加用户</button>
      </div>
      <div class="card">
        <div class="table-wrap"><table id="usersTable"><thead><tr>
          <th>ID</th><th>用户名</th><th>角色</th><th>用户组</th><th>状态</th><th>端口段</th><th>已用流量</th><th>过期时间</th><th>操作</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </section>

    <!-- 用户组 -->
    <section id="page-groups" class="hidden">
      <div class="toolbar">
        <h2 style="margin:0">用户组</h2>
        <div class="spacer"></div>
        <button class="btn" id="addGroupBtn">+ 添加用户组</button>
      </div>
      <div class="card">
        <div class="table-wrap"><table id="groupsTable"><thead><tr>
          <th>ID</th><th>组名</th><th>每用户限速</th><th>每用户配额</th><th>组内统计</th><th>用户数</th><th>状态</th><th>操作</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </section>

    <!-- 端口管理 -->
    <section id="page-ports" class="hidden">
      <div class="toolbar">
        <h2 style="margin:0">端口管理</h2>
        <select id="portUserFilter" style="width:180px"><option value="">全部用户</option></select>
        <div class="spacer"></div>
        <button class="btn" id="addPortBtn">+ 添加端口规则</button>
      </div>
      <div class="card">
        <div class="table-wrap"><table id="portsTable"><thead><tr>
          <th>端口</th><th>用户</th><th>类型</th><th>协议</th><th>目标地址</th><th>状态</th><th>已用流量</th><th>连接数</th><th>创建时间</th><th>操作</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </section>

    <!-- 协议/端口记录 -->
    <section id="page-records" class="hidden">
      <h2 style="margin-bottom:16px">协议/端口记录</h2>
      <div class="card">
        <h3>统计汇总</h3>
        <div class="stats-grid" id="recStats"></div>
      </div>
      <div class="card">
        <div class="toolbar">
          <input type="text" id="recPort" placeholder="端口" style="width:110px">
          <select id="recProto" style="width:110px">
            <option value="">全部类型</option><option value="tcp">TCP</option><option value="udp">UDP</option>
          </select>
          <select id="recProtocol" style="width:150px">
            <option value="">全部协议</option><option value="socks5">SOCKS5</option>
            <option value="wireguard">WireGuard</option><option value="openvpn">OpenVPN</option>
            <option value="unknown">未知</option>
          </select>
          <select id="recAction" style="width:140px">
            <option value="">全部动作</option><option value="allow">允许</option>
            <option value="deny_protocol">协议拒绝</option><option value="deny_quota">配额拒绝</option>
            <option value="deny_disabled">端口停用</option><option value="deny_user">用户拒绝</option>
            <option value="deny_target">目标不可达</option>
          </select>
          <button class="btn" id="recSearch">查询</button>
        </div>
        <div class="table-wrap"><table id="recordsTable"><thead><tr>
          <th>时间</th><th>用户</th><th>端口</th><th>类型</th><th>协议</th><th>来源 IP</th><th>动作</th><th>目标</th>
        </tr></thead><tbody></tbody></table></div>
      </div>
    </section>

    <!-- 系统设置 -->
    <section id="page-settings" class="hidden">
      <h2 style="margin-bottom:16px">系统设置</h2>
      <div class="card" style="max-width:640px">
        <div class="form-row">
          <label>开放自助注册</label>
          <select id="setAllowRegister"><option value="true">开启</option><option value="false">关闭</option></select>
        </div>
        <div class="form-row">
          <label>自助注册默认用户组</label>
          <select id="setDefaultGroup"></select>
        </div>
        <div class="form-row">
          <label>转发模式</label>
          <select id="setForwardMode">
            <option value="realm">realm 转发（推荐）</option>
            <option value="direct">直连转发（调试用）</option>
          </select>
        </div>
        <div class="form-row">
          <label>realm 可执行文件路径</label>
          <input type="text" id="setRealmBin">
        </div>
        <div class="form-row">
          <label>记录保留条数（100-20000）</label>
          <input type="number" id="setRecordsLimit" min="100" max="20000">
        </div>
        <button class="btn" id="saveSettingsBtn">保存设置</button>
        <div style="margin-top:14px; color:var(--text2); font-size:13px">
          <span id="realmStatus"></span>
          <button class="btn secondary sm" id="realmReloadBtn" style="margin-left:8px">重新加载 realm</button>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="/static/app.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
